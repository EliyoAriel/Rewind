priority:
  low-changes-threshold: 5         # 1-5 changes = low priority
  normal-changes-threshold: 20      # 6-20 changes = normal priority
  high-changes-threshold: 50        # 21+ changes = high priority
  low-priority-seconds: 300         # Low priority timer
  normal-priority-seconds: 60       # Normal priority timer
  high-priority-seconds: 30         # High priority timer

restore:
  chunks-per-interval: 1
  interval-ticks: 20
  min-distance-chunks: 5

notifications:
  enabled: true
  title: "&c&lRewind"
  subtitle: "&eChunk restoring in &6%seconds%s&e..."
  chat: "&eChunk at &6%x%, %z% &erestoring in &6%seconds%s"
  seconds-before: 5

progress:
  enabled: true
  chat: "&eRestoring chunks... &6[%bar%] &e%done%/%total%"
  bar-length: 20
  bar-filled: "="
  bar-empty: "-"

sounds:
  enabled: true
  sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  volume: 1.0
  pitch: 1.0

