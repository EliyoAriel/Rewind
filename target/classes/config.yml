# Rewind Plugin Configuration

general:
  default-timer: 60
  debug-mode: false

restore:
  chunks-per-interval: 1
  interval-ticks: 20
  min-distance-chunks: 5

storage:
  snapshot-dir: snapshots

messages:
  prefix: "&6[Rewind] &r"
  region-created: "&aRegion &e%name% &acreated!"
  region-deleted: "&cRegion &e%name% &cdeleted."
  region-not-found: "&cRegion &e%name% &cnot found."
  restore-complete: "&aAll regions restored!"
  no-permission: "&cYou don't have permission to do this."
